[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-native"
version = "0.1.0"
description = "Production RWKV7 CUDA training and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "ninja"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["rwkv_native", "rwkv_native.*"]
namespaces = false

[tool.setuptools.package-data]
rwkv_native = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.cuh", "third_party/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests/test_runtime_config.py",
    "tests/test_strict_forward_contract.py",
    "tests/test_masked_backward.py",
    "tests/test_checkpoint.py",
    "tests/test_large_checkpoint.py",
    "tests/test_wkv.py",
    "tests/test_head_loss.py",
    "tests/test_inference_fp64_reference.py",
    "tests/test_training_fp64_reference.py",
    "tests/test_training_benchmark_loss.py",
]

[tool.setuptools.exclude-package-data]
rwkv_native = ["**/*.rst", "**/__pycache__/*", "**/*.pyc"]
